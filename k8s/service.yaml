apiVersion: v1
kind: Service
metadata:
  name: mon-app-service
spec:
  type: NodePort
  selector:
    app: mon-app # Cible les pods avec le label "app: mon-app"
  ports:
    - protocol: TCP
      port: 80 # Port interne du service
      targetPort: 80 # Port sur lequel le conteneur écoute
      nodePort: 30080 # Port exposé sur la machine hôte (entre 30000 et 32767)
